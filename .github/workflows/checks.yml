name: Galaxy checks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      quick:
        description: 'Release fast path: install, typecheck, lint and build only (the full suite still runs on every push to main)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_FORCE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Install Chromium for browser checks
        if: ${{ !inputs.quick }}
        run: pnpm exec playwright install --with-deps chromium
      - if: ${{ !inputs.quick }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit and browser tests
        if: ${{ !inputs.quick }}
        run: pnpm run test
      - name: Real build swap acceptance
        if: ${{ !inputs.quick }}
        run: pnpm run test:live-safety
      - name: Firestore rules tests
        if: ${{ !inputs.quick }}
        env:
          JAVA_TOOL_OPTIONS: -Xmx512m
        run: pnpm run test:rules
      - name: Failure-mode drills
        if: ${{ !inputs.quick }}
        env:
          JAVA_TOOL_OPTIONS: -Xmx512m
        run: pnpm run test:drills
      - name: Load test and quota report
        if: ${{ !inputs.quick }}
        env:
          JAVA_TOOL_OPTIONS: -Xmx512m
        run: pnpm run test:load
      - name: Build and run the privacy gate
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: pnpm run build
      - name: Upload galaxy build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: galaxy-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
