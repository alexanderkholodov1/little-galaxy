name: Galaxy checks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      rehearsal:
        description: A rehearsal records failing jobs in a verdict artifact instead of failing the run.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: Unit, lint, typecheck and build
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.rehearsal }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint including the game
        run: pnpm run lint
      - name: Unit tests
        run: pnpm run test:unit
      - name: Build and run the privacy gate
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: pnpm run build
      - name: Upload galaxy build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: galaxy-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

      - name: Record rehearsal verdict
        if: ${{ always() && inputs.rehearsal }}
        run: |
          mkdir -p .tmp/verdict
          printf '{"sha":"%s","job":"%s","status":"%s"}\n' "${{ github.sha }}" "${{ github.job }}" "${{ job.status }}" > .tmp/verdict/verdict.json
          cat .tmp/verdict/verdict.json
      - name: Upload rehearsal verdict
        if: ${{ always() && inputs.rehearsal }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-verdict-${{ github.job }}
          include-hidden-files: true
          path: .tmp/verdict/verdict.json
          retention-days: 3

  rules:
    name: Current galaxy rules
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.rehearsal }}
    timeout-minutes: 6
    env:
      JAVA_TOOL_OPTIONS: -Xmx512m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Firestore allow and deny tests
        run: pnpm run test:rules

      - name: Record rehearsal verdict
        if: ${{ always() && inputs.rehearsal }}
        run: |
          mkdir -p .tmp/verdict
          printf '{"sha":"%s","job":"%s","status":"%s"}\n' "${{ github.sha }}" "${{ github.job }}" "${{ job.status }}" > .tmp/verdict/verdict.json
          cat .tmp/verdict/verdict.json
      - name: Upload rehearsal verdict
        if: ${{ always() && inputs.rehearsal }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-verdict-${{ github.job }}
          include-hidden-files: true
          path: .tmp/verdict/verdict.json
          retention-days: 3

  journey:
    name: Real player journey
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.rehearsal }}
    timeout-minutes: 6
    env:
      JAVA_TOOL_OPTIONS: -Xmx512m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Phone launch, shared history and return
        run: pnpm run test:ui
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: player-journey-failure
          path: .tmp/ui-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Record rehearsal verdict
        if: ${{ always() && inputs.rehearsal }}
        run: |
          mkdir -p .tmp/verdict
          printf '{"sha":"%s","job":"%s","status":"%s"}\n' "${{ github.sha }}" "${{ github.job }}" "${{ job.status }}" > .tmp/verdict/verdict.json
          cat .tmp/verdict/verdict.json
      - name: Upload rehearsal verdict
        if: ${{ always() && inputs.rehearsal }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-verdict-${{ github.job }}
          include-hidden-files: true
          path: .tmp/verdict/verdict.json
          retention-days: 3
