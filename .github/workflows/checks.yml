name: Galaxy check
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      rehearsal:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.rehearsal }}
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=768
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Record rehearsal verdict
        if: ${{ always() && inputs.rehearsal }}
        run: |
          mkdir -p .tmp/verdict
          printf '{"sha":"%s","job":"%s","status":"%s"}\n' "${{ github.sha }}" "${{ github.job }}" "${{ job.status }}" > .tmp/verdict/verdict.json
      - name: Upload rehearsal verdict
        if: ${{ always() && inputs.rehearsal }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-verdict-check
          include-hidden-files: true
          path: .tmp/verdict/verdict.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload check timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-timings
          include-hidden-files: true
          path: .tmp/check-*.json
          if-no-files-found: ignore
          retention-days: 3
