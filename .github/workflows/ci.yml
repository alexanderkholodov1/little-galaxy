name: Galaxy check
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: ['rehearsal/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-galaxy-ci
  cancel-in-progress: true
jobs:
  check:
    uses: ./.github/workflows/checks.yml
    with:
      rehearsal: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rehearsal/') }}
