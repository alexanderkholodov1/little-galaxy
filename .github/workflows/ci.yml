name: Galaxy check
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: ['rehearsal/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-galaxy-ci
  cancel-in-progress: true
jobs:
  check:
    uses: ./.github/workflows/checks.yml
    with:
      rehearsal: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rehearsal/') }}

  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: galaxy-dist
          path: deploy/little-galaxy
      - name: Prepare preview-only Hosting configuration for the checked build
        env:
          CHECKED_COMMIT: ${{ github.sha }}
        run: node scripts/preview.mjs prepare
      - name: Deploy the seven-day PR channel
        id: hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALEXANDERKHOLODOV }}
          projectId: alexanderkholodov
          entryPoint: deploy
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
          firebaseToolsVersion: 15.33.0
          disableComment: 'true'
      - name: Update the single Little Galaxy PR preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.hosting.outputs.details_url }}
          CHECKED_COMMIT: ${{ github.sha }}
        run: node scripts/preview.mjs comment
