name: Galaxy release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Exact existing release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: galaxy-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.version.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify release version
        id: version
        run: node scripts/verify-release.js

  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the exact released commit and run the privacy gate
        env:
          GITHUB_SHA: ${{ needs.guard.outputs.commit }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: pnpm run build
      - name: Pack and checksum release files
        env:
          RELEASE_TAG: ${{ needs.guard.outputs.tag }}
        shell: bash
        run: |
          tar -czf "galaxy-dist-${RELEASE_TAG}.tar.gz" -C apps/web/dist .
          cp apps/web/dist/version.json version.json
          sha256sum "galaxy-dist-${RELEASE_TAG}.tar.gz" version.json > SHA256SUMS
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            galaxy-dist-${{ needs.guard.outputs.tag }}.tar.gz
            version.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    # A release appears only once the rules it relies on are live.
    needs: [guard, build, deploy-rules]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: Refuse stale release before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.guard.outputs.tag }}
        run: node scripts/verify-release.js --current-main
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.guard.outputs.tag }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        shell: bash
        run: |
          options=()
          if [[ "$PRERELEASE" == true ]]; then
            options+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            mkdir published
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published \
              --pattern "galaxy-dist-${RELEASE_TAG}.tar.gz" --pattern version.json --pattern SHA256SUMS
            cmp SHA256SUMS published/SHA256SUMS
            (cd published && sha256sum --check SHA256SUMS)
          else
            gh release create "$RELEASE_TAG" \
              "galaxy-dist-${RELEASE_TAG}.tar.gz" version.json SHA256SUMS \
              --title "$RELEASE_TAG" --generate-notes --verify-tag \
              --repo "$GITHUB_REPOSITORY" "${options[@]}"
          fi
      - name: Recheck current main before portfolio dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.guard.outputs.tag }}
        run: node scripts/verify-release.js --current-main
      - name: Dispatch the exact published release to portfolio
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ needs.guard.outputs.tag }}
        shell: bash
        run: |
          : "${GH_TOKEN:?Set PORTFOLIO_DISPATCH_TOKEN for the portfolio repository}"
          jq -n --arg tag "$RELEASE_TAG" \
            '{event_type: "galaxy-release", client_payload: {tag: $tag}}' | \
            gh api --method POST repos/alexanderkholodov1/portfolio/dispatches --input -
      - name: Confirm the released commit is live in production
        timeout-minutes: 9
        env:
          RELEASE_COMMIT: ${{ needs.guard.outputs.commit }}
        run: node scripts/verify-live-version.js

  deploy-rules:
    # The operator must be configured as the required reviewer for this environment.
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: little-galaxy-rules
    concurrency:
      group: galaxy-sky-releases
      cancel-in-progress: false
    env:
      FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Refuse stale release before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.guard.outputs.tag }}
        run: node scripts/verify-release.js --current-main
      - name: Write data-project credentials
        id: credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_LITTLE_GALAXY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LITTLE_GALAXY }}
        run: |
          : "${FIREBASE_PROJECT_ID:?Set the data-project VITE_FIREBASE_PROJECT_ID repository variable}"
          umask 177
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_LITTLE_GALAXY" > "$RUNNER_TEMP/little-galaxy-rules.json"
          chmod 600 "$RUNNER_TEMP/little-galaxy-rules.json"
      - name: Deploy rules and indexes and migrate the sky with flag restoration
        timeout-minutes: 8
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/little-galaxy-rules.json
        run: pnpm --filter @little-galaxy/stand exec tsx src/index.ts release-sky
      - name: Recover the prior season setting even after cancellation or failure
        if: always() && steps.credentials.outcome == 'success'
        timeout-minutes: 2
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/little-galaxy-rules.json
        run: |
          if ! pnpm --filter @little-galaxy/stand exec tsx src/index.ts restore-season; then
            echo '::error::SEASON KEPT CLOSED OR RESTORATION FAILED. Run Operate the sky action inspect with empty key/value; incomplete post-deploy migrations must succeed before restore-season.'
            echo 'SEASON KEPT CLOSED OR RESTORATION FAILED: run Operate the sky action inspect (empty key/value), review/repair sources in Firestore Console, then re-run failed release jobs; restore-season refuses an incomplete post-deploy migration.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Remove data-project credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/little-galaxy-rules.json"
