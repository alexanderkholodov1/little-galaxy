name: Galaxy release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify release version
        run: node scripts/verify-release.js

  checks:
    needs: guard
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download checked galaxy build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: galaxy-dist
          path: dist
      - name: Pack and checksum release files
        shell: bash
        run: |
          tar -czf "galaxy-dist-${GITHUB_REF_NAME}.tar.gz" -C dist .
          cp dist/version.json version.json
          sha256sum "galaxy-dist-${GITHUB_REF_NAME}.tar.gz" version.json > SHA256SUMS
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            galaxy-dist-${{ github.ref_name }}.tar.gz
            version.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    # A release appears only once the rules it relies on are live.
    needs: [build, deploy-rules]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          options=()
          if [[ "$GITHUB_REF_NAME" == v1.0.0-alpha.* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "galaxy-dist-${GITHUB_REF_NAME}.tar.gz" version.json SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            --repo "$GITHUB_REPOSITORY" "${options[@]}"
      - name: Dispatch the exact published release to portfolio
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        shell: bash
        run: |
          : "${GH_TOKEN:?Set PORTFOLIO_DISPATCH_TOKEN for the portfolio repository}"
          jq -n --arg tag "$GITHUB_REF_NAME" \
            '{event_type: "galaxy-release", client_payload: {tag: $tag}}' | \
            gh api --method POST repos/alexanderkholodov1/portfolio/dispatches --input -

  deploy-rules:
    # The operator must be configured as the required reviewer for this environment.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: little-galaxy-rules
    env:
      FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Re-run Firestore rules tests
        env:
          JAVA_TOOL_OPTIONS: -Xmx512m
        run: pnpm run test:rules
      - name: Write data-project credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_LITTLE_GALAXY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LITTLE_GALAXY }}
        run: |
          : "${FIREBASE_PROJECT_ID:?Set the data-project VITE_FIREBASE_PROJECT_ID repository variable}"
          umask 177
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_LITTLE_GALAXY" > "$RUNNER_TEMP/little-galaxy-rules.json"
          chmod 600 "$RUNNER_TEMP/little-galaxy-rules.json"
      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/little-galaxy-rules.json
        run: pnpm exec firebase deploy --only firestore:rules,firestore:indexes --project "${FIREBASE_PROJECT_ID:?Missing data-project ID}" --non-interactive
      - name: Remove data-project credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/little-galaxy-rules.json"
